; PHP settings for a cPanel server (PHP-FPM or CGI reads this file from the document root): the send screens take
; files up to 300 MB each (EmailSendFields::MAX_UPLOAD_KB), and a request has to be allowed to carry one. A server
; whose own settings are higher keeps them; one that does not read this file needs the same under MultiPHP INI Editor.
upload_max_filesize = 310M
post_max_size = 320M
max_input_time = 600
max_execution_time = 300
